name: AceCreator AI CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

jobs:
  backend-tests:
    name: FastAPI & PostgreSQL Pytest Suite
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: acecreator_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create .env.test for isolated PostgreSQL test DB
        run: |
          cat << 'EOT' > .env.test
          DATABASE_URL=postgresql+psycopg2://postgres:testpassword@localhost:5432/acecreator_test_db
          GROQ_API_KEY=ci_test_groq_key
          INSTAGRAM_ACCESS_TOKEN=ci_test_instagram_token
          JWT_SECRET_KEY=ci_test_jwt_secret_key_for_hmac_sha256
          CORS_ORIGINS=http://localhost:3000
          EOT

      - name: Run automated pytest suite (excluding live external API scripts)
        run: pytest tests/ -v

  frontend-build:
    name: Next.js 16 TypeScript & Production Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build production Next.js bundle
        env:
          NEXT_PUBLIC_API_URL: http://127.0.0.1:8000
        run: npm run build
